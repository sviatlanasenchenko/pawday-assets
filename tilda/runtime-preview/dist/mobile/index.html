<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pawday — 390 px mobile review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f1f3ef; color: #123b32; font: 16px/1.5 system-ui, sans-serif; }
    header { width: 1218px; margin: 0 auto 20px; }
    h1 { margin: 0; font-size: 24px; }
    header p { margin: 4px 0 0; }
    main { display: grid; grid-template-columns: repeat(3, 390px); gap: 24px; width: 1218px; margin: 0 auto; align-items: start; }
    section { width: 390px; }
    h2 { margin: 0 0 10px; font-size: 18px; }
    iframe { display: block; width: 390px; height: 2200px; border: 0; background: #fff9ef; outline: 1px solid #c5d2c8; }
  </style>
</head>
<body>
  <header>
    <h1>Pawday mobile review</h1>
    <p>Three independent pages, each with a 390 px viewport.</p>
  </header>
  <main>
    <section aria-labelledby="label-en">
      <h2 id="label-en" lang="en">EN · English · 390 px</h2>
      <iframe src="../" width="390" height="2200" title="Pawday English mobile preview" loading="eager"></iframe>
    </section>
    <section aria-labelledby="label-ru">
      <h2 id="label-ru" lang="ru">RU · Русский · 390 px</h2>
      <iframe src="../ru/" width="390" height="2200" title="Pawday Russian mobile preview" loading="eager"></iframe>
    </section>
    <section aria-labelledby="label-zh">
      <h2 id="label-zh" lang="zh-Hans">ZH · 简体中文 · 390 px</h2>
      <iframe src="../zh/" width="390" height="2200" title="Pawday Chinese mobile preview" loading="eager"></iframe>
    </section>
  </main>
</body>
</html>
